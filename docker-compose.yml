services:
  postgres:
    image: postgres:16-alpine
    container_name: bmm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmm}
      POSTGRES_DB: ${POSTGRES_DB:-bmm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bmm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmm} -d ${POSTGRES_DB:-bmm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bmm_pgdata:
